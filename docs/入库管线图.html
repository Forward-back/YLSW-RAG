<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YLSW-RAG 入库管线</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
    --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; padding: 48px 32px; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--soft); margin-bottom: 12px; }
  h1 { font-family: 'Instrument Serif', serif; font-size: 28px; font-weight: 400; margin-bottom: 8px; }
  .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 32px; }
  .diagram { width: 100%; overflow-x: auto; }
  svg { display: block; min-width: 1280px; width: 100%; height: auto; }
  .footer { font-family: 'Geist Mono', monospace; font-size: 8px; color: var(--soft); letter-spacing: 0.06em; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Ingest Pipeline</div>
  <h1>YLSW-RAG 入库管线</h1>
  <div class="subtitle">幂等入库：文件哈希跳过已入库 · 差异化分块 · 索引自愈</div>

  <div class="diagram">
    <svg role="img" aria-labelledby="ingest-pipeline-title ingest-pipeline-desc" viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg">
      <title id="ingest-pipeline-title">YLSW-RAG 入库管线图</title>
      <desc id="ingest-pipeline-desc">从左到右依次为文件源（Data 语料）、解析、差异化分块、Parent-Child 分层、BGE-M3 嵌入、MySQL 与 FAISS 存储；分块为焦点环节，存储节点下方注明索引自愈机制。</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- connectors -->
      <line x1="228" y1="260" x2="248" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="404" y1="260" x2="424" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="612" y1="260" x2="632" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="796" y1="260" x2="816" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="988" y1="260" x2="1008" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 文件源 -->
      <rect x="92" y="224" width="136" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="92" y="224" width="136" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="160" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">文件源</text>
      <text x="160" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Data/ 六类文档</text>
      <text x="160" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">哈希幂等跳过</text>

      <!-- 解析 -->
      <rect x="252" y="224" width="152" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="252" y="224" width="152" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="260" y="230" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="282" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARSE</text>
      <text x="328" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">解析</text>
      <text x="328" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PDF / DOCX / XLSX / MD</text>
      <text x="328" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OCR · 表格抽取 · VL 图片</text>

      <!-- 差异化分块 (focal) -->
      <rect x="428" y="224" width="184" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="224" width="184" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="436" y="230" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="462" y="239" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHUNK</text>
      <text x="520" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">差异化分块</text>
      <text x="520" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">法规按条 · 手册按节</text>
      <text x="520" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">新闻整篇 · 表格转述</text>

      <!-- Parent-Child -->
      <rect x="636" y="224" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="636" y="224" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="644" y="230" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="662" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIER</text>
      <text x="716" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parent-Child</text>
      <text x="716" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">child 300 / parent 1200</text>
      <text x="716" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">标题链前缀注入</text>

      <!-- BGE-M3 嵌入 -->
      <rect x="820" y="224" width="168" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="820" y="224" width="168" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="828" y="230" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="850" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED</text>
      <text x="904" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BGE-M3 嵌入</text>
      <text x="904" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">本地 / API 双后端</text>
      <text x="904" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">768 维截断</text>

      <!-- 存储 -->
      <rect x="1012" y="224" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1012" y="224" width="176" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1100" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MySQL + FAISS 索引</text>
      <text x="1100" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">chunks · 结构化表 · 倒排</text>
      <text x="1100" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HNSW · ef 192</text>

      <!-- 自愈注释 -->
      <text x="1100" y="330" fill="#4f5d75" font-size="12" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">索引自愈：索引缺失 → 重置 pending → 全量重嵌</text>

      <!-- legend -->
      <line x1="92" y1="400" x2="1188" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="92" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="164" y="412" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="182" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">焦点：差异化分块</text>
      <rect x="296" y="412" width="10" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="314" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">持久化存储</text>
      <text x="430" y="420" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" font-style="italic">改分块参数需清库重入（幂等仅比对文件哈希）· 换 embedding 源触发全量重建</text>
    </svg>
  </div>

  <div class="footer">YLSW-RAG · 入库管线 · 详见 架构设计.md §2</div>
</div>
</body>
</html>
