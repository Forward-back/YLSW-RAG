<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="arch-overview-title arch-overview-desc" viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg">
      <title id="arch-overview-title">YLSW-RAG 查询主链路架构图</title>
      <desc id="arch-overview-desc">从左到右依次为用户问题、规划器与变体并行、四路并行检索（FAISS 语义、BM25、元数据、Text-to-SQL）、RRF 融合、精排、上下文组装、LLM 生成；检索节点向下连接 MySQL 与 FAISS 索引存储。所有 LLM、embedding 与精排调用经外部模型网关。</desc>

      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- connectors drawn before boxes -->
      <!-- input → planner -->
      <line x1="136" y1="260" x2="156" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- planner → retrieval -->
      <line x1="320" y1="260" x2="336" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- retrieval → rrf -->
      <line x1="520" y1="260" x2="536" y2="260" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- rrf → rerank -->
      <line x1="656" y1="260" x2="672" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- rerank → assemble -->
      <line x1="856" y1="260" x2="872" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- assemble → generate -->
      <line x1="1056" y1="260" x2="1072" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- retrieval → store -->
      <line x1="428" y1="300" x2="428" y2="396" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="404" y="332" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="428" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

      <!-- INPUT 用户问题 -->
      <rect x="24" y="232" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="232" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="80" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">用户问题</text>
      <text x="80" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /chat</text>

      <!-- n1 规划器 ∥ 变体 -->
      <rect x="160" y="224" width="156" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="224" width="156" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="230" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="198" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN+VAR</text>
      <text x="238" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">规划器 ∥ 变体</text>
      <text x="238" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">标签 · 计划 · 2-3 同义查询</text>

      <!-- n2 四路并行检索 (focal) -->
      <rect x="340" y="224" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="224" width="176" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="348" y="230" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="374" y="239" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4-WAY</text>
      <text x="428" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">四路并行检索</text>
      <text x="428" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FAISS·BGE-M3 / BM25</text>
      <text x="428" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">元数据 / Text-to-SQL</text>

      <!-- n3 RRF -->
      <rect x="540" y="232" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="232" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="596" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RRF 融合</text>
      <text x="596" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">多路共识加分</text>

      <!-- n4 精排 -->
      <rect x="676" y="224" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="676" y="224" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="684" y="230" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="710" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RERANK</text>
      <text x="764" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">精排 · BGE-Reranker</text>
      <text x="764" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">多路打分并行 · 章节多样性</text>

      <!-- n5 上下文组装 -->
      <rect x="876" y="224" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="876" y="224" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="884" y="230" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="914" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASSEMBLE</text>
      <text x="964" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">上下文组装</text>
      <text x="964" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Parent 分层 · 摘要前置 · 保覆盖</text>

      <!-- n6 LLM 生成 -->
      <rect x="1076" y="224" width="148" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1076" y="224" width="148" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1084" y="230" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="1112" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GENERATE</text>
      <text x="1150" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM 生成</text>
      <text x="1150" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">标签提示词 · CoT · 拒答</text>

      <!-- STORE -->
      <rect x="340" y="400" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="400" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="428" y="426" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MySQL + FAISS 索引</text>
      <text x="428" y="442" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1881 chunks · 入库管线写入</text>

      <!-- legend -->
      <line x1="24" y1="504" x2="1256" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="96" y="516" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="114" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">焦点：检索核心</text>
      <rect x="228" y="516" width="10" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="246" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">数据存储</text>
      <line x1="336" y1="521" x2="356" y2="521" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="364" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">数据读取</text>
      <text x="470" y="524" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" font-style="italic">外部模型 API：规划 · 精排 · 生成均经网关调用，任一阶段挂起按降级矩阵回退</text>
    </svg>
